<!-- === Modální okno pro vytvoření tréninku === -->
<div id="trainingModal" class="modal">
    <div class="modal-content">
        <span class="close-training-modal" style="float:right;cursor:pointer;font-size:20px;">&times;</span>
        <h2>Vytvořit nový trénink</h2>
        <form id="trainingForm">
            <label for="nameOfLesson">Název lekce:</label>
            <input type="text" id="nameOfLesson" name="nameOfLesson" required><br><br>

            <label for="coachName">Jméno trenéra:</label>
            <input type="text" id="coachName" name="coachName" required><br><br>

            <label for="startOfCurrentLesson">Začátek lekce:</label>
            <input type="datetime-local" id="startOfCurrentLesson" name="startOfCurrentLesson" required><br><br>

            <label for="endOfCurrentLesson">Konec lekce:</label>
            <input type="datetime-local" id="endOfCurrentLesson" name="endOfCurrentLesson" required><br><br>

            <label for="capacity">Kapacita:</label>
            <input type="number" id="capacity" name="capacity" required><br><br>

            <label for="repeatEveryWeek">Počet týdnů opakování (0 a 1 = bez opakování):</label>
            <input type="number" id="repeatEveryWeek" name="repeatEveryWeek" min="0" value="0"><br><br>

            <button type="submit">Vytvořit trénink</button>
        </form>
    </div>
</div>

<section>
    <h2>Vytvořit rezervaci</h2>
    <form id="reservationForm">
        <label for="name">Jméno:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Telefon:</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="trainingId">ID tréninku:</label>
        <input type="number" id="trainingId" name="trainingId" required><br><br>

        <label for="numberOfPeople">Počet míst:</label>
        <input type="number" id="numberOfPeople" name="numberOfPeople" required><br><br>

        <button type="submit">Zarezervovat</button>
    </form>
</section>

<section>
    <h2>Odhlášení</h2>
    <button onclick="logout()">Odhlásit se</button>
</section>
