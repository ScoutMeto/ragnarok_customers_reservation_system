<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Login stránka</title>
  <script src="/js/index.js" defer></script>
</head>
<body>
<h1>Vítej v rezervačním systému</h1>

<h2>Vytvořit rezervaci</h2>
<form id="reservationForm">
  <label for="name">Jméno:</label>
  <input type="text" id="name" name="name" required><br><br>

  <label for="email">E-mail:</label>
  <input type="email" id="emailReservation" name="email" required><br><br>

  <label for="phone">Telefon:</label>
  <input type="tel" id="phone" name="phone" required><br><br>

  <label for="trainingId">ID tréninku:</label>
  <input type="number" id="trainingId" name="trainingId" required><br><br>

  <label for="numberOfPeople">Počet míst:</label>
  <input type="number" id="numberOfPeople" name="numberOfPeople" required><br><br>

  <button type="submit">Zarezervovat</button>
</form>

<form onsubmit="event.preventDefault(); login();">
  <label for="email">Email:</label>
  <input type="email" id="email" required><br>

  <label for="password">Heslo:</label>
  <input type="password" id="password" required><br>

  <button type="submit">Přihlásit se</button>
</form>
</body>
</html>
