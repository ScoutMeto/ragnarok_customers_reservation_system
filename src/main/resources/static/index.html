<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rezervace lekcí</title>
  <link rel="stylesheet" href="/css/index.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar/index.global.min.js"></script>
  <script src="/js/index.js" defer></script>
</head>
<body>

<h1>Rezervace lekcí</h1>

<!-- === Modal pro zobrazení detailu lekce === -->
<div id="eventModal" class="modal">
  <div class="modal-content">
    <span class="close-button">&times;</span>
    <h3 id="modal-title"></h3>
    <p><strong>Trenér:</strong> <span id="modal-coach"></span></p>
    <p><strong>Kapacita:</strong> <span id="modal-capacity"></span></p>
    <p><strong>Rezervace:</strong> <span id="modal-reservations"></span></p>
    <div id="modal-message">Kapacita lekce naplněna.</div>
    <button id="createReservationBtn">➕ Vytvořit rezervaci</button>

<!--    Zobrazení zervačního listu-->
    <hr>

    <div id="reservationsList">
      <h4>Rezervace</h4>
      <ul id="reservationsContainer"></ul>
    </div>

  </div>
</div>

<!-- === Modal pro vytvoření rezervace === -->
<div id="reservationModal" class="modal">
  <div class="modal-content">
    <span class="close-reservation-modal">&times;</span>
    <h2>Vytvořit rezervaci</h2>
    <form id="reservationForm">
      <input type="hidden" id="reservationTrainingId" name="trainingId">
      <label for="firstName">Jméno:</label>
      <input type="text" id="firstName" name="firstName" required><br><br>
      <label for="secondName">Příjmení:</label>
      <input type="text" id="secondName" name="secondName" required><br><br>
      <label for="userEmail">E-mail:</label>
      <input type="email" id="userEmail" name="userEmail" placeholder="nepovinný údaj"><br><br>
      <label for="phone">Telefon:</label>
      <input type="tel" id="phone" name="telephoneNumber" required><br><br>
      <label for="numberOfPeople">Počet míst:</label>
      <input type="number" id="numberOfPeople" name="numberOfBookedEntries" min="1" required><br><br>
      <button type="submit" id="submitReservationBtn">Zarezervovat</button>
    </form>
  </div>
</div>

<div id="calendar"></div>

<div class="login-container">
  <button class="login-toggle">Přihlásit ▾</button>
  <div class="login-dropdown" id="loginDropdown">
    <form id="loginForm" onsubmit="event.preventDefault(); login();">
      <label for="emailAdmin">Email:</label>
      <input type="email" id="emailAdmin" required>
      <label for="password">Heslo:</label>
      <input type="password" id="password" required>
      <button type="submit">OK</button>
    </form>
  </div>
</div>

<!--hlášky místo "alert" kvůli mobilním prohlížečům-->
<div id="toast" class="toast" style="display: none;"></div>


</body>
</html>
