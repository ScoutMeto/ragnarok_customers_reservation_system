spring.application.name=ragnarok_customers_reservation_system
server.port = 8080

# Thymeleaf engine configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Configuration MySQL db
# JPA configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ragnarok_matejmarekproject_database?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
#spring.sql.init.mode=always
# Update database, maybe "create" need during the development
spring.jpa.show-sql=true
# update, create, validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.data.jpa.repositories.enabled=true
#spring.data.jdbc.repositories.enabled=false

spring.jpa.properties.hibernate.format_sql=true

# detaily bindovaných parametr?
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Extra configuration for JDBC (old config for mysql)
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver


# Date and time configuration
spring.jackson.date-format=dd.MM.yyyy
spring.jackson.time-zone=UTC


# Let enum load by the Jackson Object Mapper from JSON, in case the enum is lowercase (general rule says enum must be uppercase)
spring.jackson.mapper.accept-case-insensitive-enums=true