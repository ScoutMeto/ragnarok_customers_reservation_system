# varianta pro ostrý provoz skrz Railway.app
spring.application.name=ragnarok_customers_reservation_system
server.port=8080

# Thymeleaf engine configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

postgresql://postgres:DkEmbcshcNBpGckWgljbnqyrAYIEwDHx@postgres-copy.railway.internal:5432/railway


# === PostgreSQL on Railway ===
spring.datasource.url=jdbc:postgresql://postgres-copy.railway.internal:5432/railway
spring.datasource.username=postgres
spring.datasource.password=DkEmbcshcNBpGckWgljbnqyrAYIEwDHx
spring.datasource.driver-class-name=org.postgresql.Driver

server.forward-headers-strategy=framework


spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL + binding parameters
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Date and time configuration
spring.jackson.date-format=dd.MM.yyyy
spring.jackson.time-zone=UTC

# ENUM case-insensitivity
spring.jackson.mapper.accept-case-insensitive-enums=true

#metriky kvuli cache
management.endpoints.web.exposure.include=health,metrics,caches,heapdump,threaddump
management.endpoint.metrics.enabled=true

#maximum request lines
server.tomcat.threads.max=50
#"stand by" requests
server.tomcat.accept-count=50

##Caffeine as cache provider
#spring.cache.type=caffeine
#
## max 5 items (5 pages of calendar) + automatic expire after 1 min.
#spring.cache.caffeine.spec=maximumSize=5,expireAfterWrite=1m

